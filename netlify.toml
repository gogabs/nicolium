[build]
  command = "npx --yes pnpm@11.17.0 -F pl-api build && npx --yes pnpm@11.17.0 -F nicolium build"
  publish = "packages/nicolium/dist"

[build.environment]
  NODE_VERSION = "22"
  # Only install the web client and its workspace deps; the Expo app (micolium)
  # pulls a git-hosted package that fails to build on Netlify.
  PNPM_FLAGS = "--filter nicolium..."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0"

[[headers]]
  for = "/packs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serve index.html for client-side routes; existing files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
